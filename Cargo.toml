[workspace]
members = ["apps/client", "crates/client-core", "crates/client-net"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
cod4xr-client-core = { path = "crates/client-core" }
cod4xr-client-net = { path = "crates/client-net" }
cod4x-protocol = { git = "https://github.com/cod4xr/server.git", rev = "c3bd151068465a40e11e3db9d616789fdffa146f" }
cod4x-transport = { git = "https://github.com/cod4xr/server.git", rev = "c3bd151068465a40e11e3db9d616789fdffa146f" }
cod4x-observability = { git = "https://github.com/cod4xr/server.git", rev = "c3bd151068465a40e11e3db9d616789fdffa146f" }
getrandom = { version = "=0.4.3", features = ["std"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
serde_json = "=1.0.154"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
